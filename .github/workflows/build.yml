name: CI

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      pg_versions:
        description: 'Space-separated PostgreSQL versions to build (listed in support-matrix.json)'
        required: false
        default: '18.6 17.11 13.23'

permissions:
  contents: read

concurrency:
  group: pgdumpplus-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: pick
        env:
          REQUESTED_VERSIONS: ${{ inputs.pg_versions }}
        run: |
          python3 scripts/public_audit.py
          python3 -m json.tool docs/design/profile-schema.json >/dev/null
          python3 scripts/validate_profile.py docs/examples/profiles/*.json
          invalid_profile=$(mktemp)
          printf '%s' '{"schema_version":1,"schema_version":1}' > "$invalid_profile"
          if python3 scripts/validate_profile.py "$invalid_profile"; then
            echo 'duplicate profile keys were accepted' >&2
            exit 1
          fi
          printf '%s' '{"schema_version":1,"unexpected":true}' > "$invalid_profile"
          if python3 scripts/validate_profile.py "$invalid_profile"; then
            echo 'unknown profile fields were accepted' >&2
            exit 1
          fi
          printf '%s' '{"schema_version":1,"masks":[{"table":"public.users","column":"email","preset":"email"},{"table":"public.users","column":"email","preset":"all"}]}' > "$invalid_profile"
          if python3 scripts/validate_profile.py "$invalid_profile"; then
            echo 'duplicate mask targets were accepted' >&2
            exit 1
          fi
          printf '%s' '{"schema_version":true}' > "$invalid_profile"
          if python3 scripts/validate_profile.py "$invalid_profile"; then
            echo 'boolean schema versions were accepted' >&2
            exit 1
          fi
          blocked_tasks=$(mktemp)
          sed 's/| A3 | DONE |/| A3 | IN_PROGRESS |/' TASKS.md > "$blocked_tasks"
          if python3 scripts/release_gate.py v2.0.0 "$blocked_tasks"; then
            echo 'v2 release gate unexpectedly passed with incomplete tasks' >&2
            exit 1
          fi
          python3 scripts/release_gate.py v2.0.0
          python3 scripts/release_gate.py v1.2.1
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="$REQUESTED_VERSIONS"
          else
            V=$(jq -r '[.postgresql[].tested_minor] | join(" ")' support-matrix.json)
          fi
          [[ -n "$V" ]] || { echo "No PostgreSQL versions requested" >&2; exit 1; }
          majors=$(jq -r '[.postgresql[].major | tostring] | join("|")' support-matrix.json)
          for version in $V; do
            [[ "$version" =~ ^($majors)\.[0-9]+$ ]] || { echo "Unsupported version" >&2; exit 1; }
          done
          J=$(printf '%s' "$V" | tr ' ' '\n' | sed '/^$/d' | jq -R . | jq -s -c .)
          echo "versions=$J" >> "$GITHUB_OUTPUT"

  verify:
    needs: plan
    uses: ./.github/workflows/verify.yml
    with:
      pg_versions: ${{ needs.plan.outputs.versions }}

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: almalinux:8
    strategy:
      fail-fast: false
      matrix:
        pg_version: ${{ fromJson(needs.plan.outputs.versions) }}
    name: pg_dumpplus ${{ matrix.pg_version }} (EL8)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build dependencies
        run: dnf install -y gcc make bison flex perl zlib-devel openssl-devel rpm-build python3 curl tar gzip diffutils binutils

      - name: Build client package
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh "${{ matrix.pg_version }}" /tmp/pgb
          # Build an older project version from the same upstream source for
          # the RPM upgrade-order test. It is a disposable CI fixture only.
          oldrepo=$(mktemp -d)
          cp -a . "$oldrepo/repo"
          sed -i 's/"project_version": "[0-9.]*"/"project_version": "1.1.0"/' "$oldrepo/repo/support-matrix.json"
          (cd "$oldrepo/repo" && chmod +x scripts/build.sh && ./scripts/build.sh "${{ matrix.pg_version }}" /tmp/pgb-old)
          mkdir -p /tmp/upgrade-rpm
          cp "$oldrepo/repo"/dist/*.rpm /tmp/upgrade-rpm/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pg_dumpplus-${{ matrix.pg_version }}-linux-x86_64
          path: dist/*
          if-no-files-found: error

      - name: Upload upgrade fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-fixture-${{ matrix.pg_version }}
          path: /tmp/upgrade-rpm/*.rpm
          if-no-files-found: error

  build-deb:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg_version: ${{ fromJson(needs.plan.outputs.versions) }}
        dist:
          - image: ubuntu:22.04
            tag: ubuntu2204
          - image: ubuntu:24.04
            tag: ubuntu2404
          - image: debian:12
            tag: debian12
    container:
      image: ${{ matrix.dist.image }}
    name: deb ${{ matrix.pg_version }} (${{ matrix.dist.tag }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bison flex zlib1g-dev libssl-dev dpkg-dev python3 ca-certificates curl

      - name: Build client package
        run: |
          chmod +x scripts/build_deb.sh
          PGVER="${{ matrix.pg_version }}" ./scripts/build_deb.sh /tmp/debout
          echo "OUT=/tmp/debout" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pg_dumpplus-${{ matrix.pg_version }}-${{ matrix.dist.tag }}
          path: /tmp/debout/*
          if-no-files-found: error

  smoke-rpm:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: almalinux:8
    strategy:
      fail-fast: false
      matrix:
        pg_version: ${{ fromJson(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pg_dumpplus-${{ matrix.pg_version }}-linux-x86_64
          path: packages
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: upgrade-fixture-${{ matrix.pg_version }}
          path: packages
      - name: Install and remove in a runtime-only container
        shell: bash
        env:
          PGVER: ${{ matrix.pg_version }}
        run: |
          set -euo pipefail
          packages=("$PWD"/packages/*.rpm)
          [[ ${#packages[@]} == 2 ]]
          expected_project=$(sed -n 's/.*"project_version": "\([0-9.]*\)".*/\1/p' support-matrix.json)
          [[ -n "$expected_project" ]]
          old=''; newer=''
          for package in "${packages[@]}"; do
            version=$(rpm -qp --qf '%{VERSION}' "$package")
            if [[ "$version" == 1.1.0 ]]; then old=$package; fi
            if [[ "$version" == "$expected_project" ]]; then newer=$package; fi
          done
          [[ -n "$old" && -n "$newer" ]]
          export EXPECTED_PROJECT_VERSION=$(sed -n 's/.*"project_version": "\([0-9.]*\)".*/\1/p' support-matrix.json)
          [[ -n "$EXPECTED_PROJECT_VERSION" ]]
          export EXPECTED_OLDER_VERSION=1.1.0
          bash scripts/smoke_package.sh rpm "${PGVER%%.*}" "$old" "$newer"

  smoke-deb:
    needs: [plan, build-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pg_version: ${{ fromJson(needs.plan.outputs.versions) }}
        dist:
          - image: ubuntu:22.04
            tag: ubuntu2204
          - image: ubuntu:24.04
            tag: ubuntu2404
          - image: debian:12
            tag: debian12
    container:
      image: ${{ matrix.dist.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pg_dumpplus-${{ matrix.pg_version }}-${{ matrix.dist.tag }}
          path: packages
      - name: Install and remove in a runtime-only container
        shell: bash
        env:
          PGVER: ${{ matrix.pg_version }}
        run: |
          set -euo pipefail
          apt-get update -qq
          packages=("$PWD"/packages/*.deb)
          [[ ${#packages[@]} == 1 ]]
          export EXPECTED_PROJECT_VERSION=$(sed -n 's/.*"project_version": "\([0-9.]*\)".*/\1/p' support-matrix.json)
          [[ -n "$EXPECTED_PROJECT_VERSION" ]]
          old=$(mktemp --suffix=.deb)
          rm -f "$old"
          bash scripts/make_deb_upgrade_fixture.sh "${packages[0]}" "$old"
          export EXPECTED_OLDER_VERSION=1.1.0
          export SKIP_OLDER_BUILD_INFO_VERSION_CHECK=1
          bash scripts/smoke_package.sh deb "${PGVER%%.*}" "$old" "${packages[0]}"

  release:
    needs: [build, build-deb, verify, smoke-rpm, smoke-deb]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-dist
          pattern: pg_dumpplus-*
          merge-multiple: true

      - name: Enforce release boundary
        run: python3 scripts/release_gate.py "${GITHUB_REF_NAME:-}"

      - name: Validate release asset set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find all-dist -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ ${#assets[@]} -gt 0 ]]
          [[ ${#assets[@]} -eq $(printf '%s\n' "${assets[@]}" | sort -u | wc -l) ]]
          while IFS= read -r path; do
            [[ -f "$path" && ! -L "$path" ]]
          done < <(find all-dist -maxdepth 1 -type f -print)

      - name: Generate SPDX SBOM
        run: |
          tmp_sbom=$(mktemp)
          python3 scripts/generate_sbom.py all-dist > "$tmp_sbom"
          mv "$tmp_sbom" all-dist/SBOM.spdx.json

      - name: Unified SHA256SUMS over the final asset set
        run: |
          cd all-dist
          rm -f SHA256SUMS*.txt
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort | xargs sha256sum > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt

      - name: Reject a tampered release asset
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          target=$(find all-dist -maxdepth 1 -type f ! -name 'SBOM.spdx.json' | sort | head -1)
          backup=$(mktemp)
          cp "$target" "$backup"
          trap 'cp "$backup" "$target"' EXIT
          printf 'tamper-check' >> "$target"
          if (cd all-dist && sha256sum --check ../SHA256SUMS.txt); then
            echo 'tampered asset unexpectedly passed checksum verification' >&2
            exit 1
          fi

      - name: Attest release assets
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            all-dist/*
            SHA256SUMS.txt

      - name: Verify release attestations
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            gh attestation verify "$path" --repo "$GITHUB_REPOSITORY" >/dev/null
          done < <(find all-dist -maxdepth 1 -type f -print | sort)
          gh attestation verify SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Publish GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: |
            all-dist/*
            SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Precompiled pg_dumpplus with matching restore client and private libpq.
            Choose the package for your OS: EL8 RPM, Ubuntu 22.04/24.04 or Debian 12 DEB.
            No compilation or PostgreSQL server installation is needed on the client.
            Install with `dnf install ./<pkg>.rpm` or `apt install ./<pkg>.deb`.
            Run `pg_dumpplus-<major> --version`; PG18 also supplies `pg_dumpplus`.
            Tarballs share the same opt/ and usr/ layout. Runtime dependencies remain OS-specific.

      - name: Upload workflow artifacts (dispatch builds)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pg_dumpplus-all-${{ github.run_number }}
          path: |
            all-dist/*
            SHA256SUMS.txt
