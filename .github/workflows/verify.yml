name: Verify

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      pg_versions:
        description: JSON array of PostgreSQL versions to verify
        type: string
        default: '["13.23", "17.11", "18.6"]'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg_version: ${{ fromJSON(inputs.pg_versions || '["13.23", "17.11", "18.6"]') }}
    container:
      image: ubuntu:24.04
    services:
      pg:
        image: postgres:${{ matrix.pg_version }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: pg
      PGUSER: postgres
      PGPORT: '5432'
      PGVER: ${{ matrix.pg_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential bison flex zlib1g-dev pkg-config \
            postgresql-client python3 ca-certificates curl

      - name: Build candidate clients without installing
        shell: bash
        run: |
          set -euo pipefail
          TAG="REL_${PGVER//./_}"
          BUILD=$(mktemp -d)
          cd "$BUILD"
          curl -fsSL --retry 3 -o postgres.tar.gz \
            "https://codeload.github.com/postgres/postgres/tar.gz/refs/tags/$TAG"
          tar xzf postgres.tar.gz
          SRC="$BUILD/postgres-$TAG"
          python3 "$GITHUB_WORKSPACE/scripts/test_patcher.py" "$SRC"
          python3 "$GITHUB_WORKSPACE/scripts/apply_pgdumpplus.py" "$SRC"
          cd "$SRC"
          ./configure --without-readline --without-icu >configure.log 2>&1 || { tail -30 configure.log; exit 1; }
          make -C src/backend generated-headers >headers.log 2>&1 || { tail -30 headers.log; exit 1; }
          # Direct subdirectory builds can race over shared prerequisite archives.
          make -C src/bin/pg_dump -j1 >build.log 2>&1 || { tail -50 build.log; exit 1; }
          echo "CLIENTS=$SRC/src/bin/pg_dump" >> "$GITHUB_ENV"

      - name: Isolated dump and restore verification
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_isolated.py \
            --binary "$CLIENTS/pg_dumpplus" \
            --vanilla "$CLIENTS/pg_dump" \
            --pg-restore "$CLIENTS/pg_restore"
